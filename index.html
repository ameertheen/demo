<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Contact Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My Contact Manager</h1>

    <form id="contact-form" class="form">
      <label>
        Name
        <input type="text" id="name" name="name" required placeholder="Ada Lovelace">
      </label>
      <label>
        Email
        <input type="email" id="email" name="email" required placeholder="ada@example.com">
      </label>
      <label>
        Phone
        <input type="tel" id="phone" name="phone" required placeholder="555-0100">
      </label>
      <button type="submit">Add contact</button>
    </form>

    <ul id="contact-list" class="contact-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
